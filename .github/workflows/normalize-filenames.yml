name: Normalize solution filenames

on:
  workflow_dispatch:

concurrency:
  group: archive-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize duplicate/legacy solution filenames
        run: python3 scripts/normalize_solution_filenames.py

      - name: Regenerate public inventory documents
        run: |
          python3 scripts/generate_index.py
          python3 scripts/report_coverage.py

      - name: Commit normalized filenames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A problems FILENAME_NORMALIZATION.md INDEX.md COVERAGE.md
          if git diff --cached --quiet; then
            echo "No filename changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize solution filenames and remove same-language duplicates"
          git pull --rebase origin main
          git push origin HEAD:main
