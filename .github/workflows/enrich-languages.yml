name: Enrich solution languages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-languages.yml'
      - 'scripts/enrich_kamyu_languages.py'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing attributed language variants
        run: python3 scripts/enrich_kamyu_languages.py

      - name: Recalculate exact coverage
        run: python3 scripts/report_coverage.py

      - name: Commit enrichment and coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems ENRICHMENT_STATUS.md COVERAGE.md
          if git diff --cached --quiet; then
            echo "No enrichment changes to commit."
            exit 0
          fi
          git commit -m "feat: enrich attributed multi-language coverage"
          git push origin HEAD:main
