name: Import attributed LeetCode solutions

on:
  workflow_dispatch:

concurrency:
  group: archive-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import-solutions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import missing solution snippets
        run: python3 scripts/import_doocs.py

      - name: Regenerate public inventory documents
        run: |
          python3 scripts/generate_index.py
          python3 scripts/report_coverage.py

      - name: Commit imported solutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems IMPORT_STATUS.md NOTICE.md INDEX.md COVERAGE.md
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "feat: import attributed multi-language solutions 3000-4000"
          git push origin HEAD:main
